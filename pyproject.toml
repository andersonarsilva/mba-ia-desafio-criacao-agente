[project]
name = "aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora com Google ADK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.9.1",
    "fastapi>=0.133,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
aurora-restaurar = "aurora.cli:restaurar"
aurora-api = "aurora.cli:api"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:xdist"
